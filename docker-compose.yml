version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - DATABASE_URL=file:./prod.db
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - db_data:/app/prisma
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  db_data:
